name: CI

# Nothing merges into main that a reviewer would have to run locally to trust.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Unit tests
        # tests/ not one file: a new test module that nothing runs is not a test.
        # No key is set here, so the provider tests exercise the offline paths -
        # budget, redaction, dotenv precedence, degradation - which is exactly
        # the half that must never depend on a network.
        run: pytest tests/ -q

      - name: Adversarial patterns
        run: python tests/test_attacks.py

      - name: Held-out adversarial eval
        run: python eval/heldout.py

  scoreboard:
    name: scoreboard reproduces and does not regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate the dataset
        run: python data/generate.py

      - name: The dataset is deterministic
        # Same seed, same 1,000 rows. If this diff is non-empty, a number in the
        # README just silently stopped being reproducible.
        run: git diff --exit-code -- data/

      - name: Score, and fail on regression
        run: python eval/evaluate.py --gate

      - name: Verify the ledger chain
        run: |
          python -c "
          from parchi.ledger import verify_chain
          ok, msg, n = verify_chain('eval/ledger.jsonl')
          print(msg)
          raise SystemExit(0 if ok and n == 1000 else 1)
          "

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scoreboard
          path: |
            eval/results.json
            eval/results.md

  demo:
    name: demo server boots and authorises
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Boot the checkpoint and run every scenario
        run: |
          PARCHI_DEMO_PROVIDER=heuristic python demo/server.py &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/scenarios >/dev/null && break
            sleep 1
          done
          python - <<'PY'
          import json, urllib.request
          expected = {
              "allow": "ALLOW", "over_cap": "BLOCK", "injection": "BLOCK",
              "step_up": "STEP_UP", "expired": "BLOCK", "wrong_method": "BLOCK",
              "payee_substitution": "BLOCK", "replay": "BLOCK",
              "quantity_inflation": "BLOCK", "agent_substitution": "BLOCK",
              "wrong_category": "BLOCK",
              "coupon_burst": "BLOCK", "coupon_drift": "BLOCK",
              # The mistake scenario is ALLOW on purpose: the purchase clears
              # every rule and goes out (rules-only, no intent call in the
              # payment path), and the after-purchase review proposes the
              # refund. The proposal lands on the console, not in this verdict.
              "agent_mistake": "ALLOW",
              "burst": "ALLOW",
              # The swarm attempt itself passes every deterministic check -
              # that is the whole point of it. The alert fires on top, and the
              # cooldown lands on the NEXT attempt, so this one is ALLOW with
              # or without a model behind the adjudicator.
              "swarm": "ALLOW",
          }
          # Every scenario the page offers must be covered here: one added to the
          # server and forgotten here is a scenario nothing checks.
          catalogue = json.load(urllib.request.urlopen(
              "http://127.0.0.1:8000/api/scenarios", timeout=20))
          missing = {s["id"] for s in catalogue["scenarios"]} - set(expected)
          if missing:
              raise SystemExit(f"scenarios with no expected verdict in CI: {sorted(missing)}")
          failed = False
          for scenario, want in expected.items():
              # From a clean account each time. The coupon scenarios cool the
              # account down for ten minutes, deterministically and with no
              # model, which is the feature working: without this reset every
              # scenario after them is correctly BLOCKED by that cooldown and
              # the sweep measures the cooldown instead of the scenario.
              urllib.request.urlopen(urllib.request.Request(
                  "http://127.0.0.1:8000/api/reset", data=b"",
                  headers={"content-type": "application/json"}), timeout=20).read()
              req = urllib.request.Request(
                  "http://127.0.0.1:8000/api/authorize",
                  data=json.dumps({"scenario": scenario}).encode(),
                  headers={"content-type": "application/json"})
              got = json.load(urllib.request.urlopen(req, timeout=20))["decision"]["verdict"]
              print(f"{'ok  ' if got == want else 'FAIL'} {scenario:14s} want {want:8s} got {got}")
              failed |= got != want
          raise SystemExit(1 if failed else 0)
          PY
