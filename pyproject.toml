[project]
name = "parchi"
version = "0.1.0"
description = "A permission layer for AI-initiated payments."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
]

[project.optional-dependencies]
demo = ["fastapi>=0.110", "pydantic>=2.6", "uvicorn>=0.27"]
anthropic = ["anthropic>=1.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["parchi*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import order
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "E501",    # long lines are handled by line-length, not by shouting
    "B008",    # fastapi dependency defaults
    "RUF001",
    "RUF002",  # the attack suite contains Cyrillic homoglyphs on purpose
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# The attack suite registers patterns with repeated `def _()` on purpose:
# the decorator holds the name, the function body holds the attack.
"tests/test_attacks.py" = ["F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
