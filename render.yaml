# Deploying the demo.
#
# Netlify and Vercel cannot host this. Both are static hosting plus short-lived
# serverless functions, and this is a long-running process: the adjudicator
# answers on a background thread AFTER the response is sent, the ten-minute
# cooldown is in-memory state shared between requests, and the ledger is a
# hash chain appended to on disk. On a serverless host the swarm never gets
# adjudicated, the cooldown never holds, and the chain restarts every request.
#
# So this is a normal web service on a host that runs a normal process.
# Render is named here because its free tier does that from a GitHub repo with
# no card; Railway, Fly.io and Hugging Face Spaces all work the same way.
#
# NO API KEY IS SET, deliberately.
#
# Two reasons, and the second is the one that matters. A public demo is public:
# a key on it is spent by whoever finds it first, and the dev key this repo is
# built against allows 100 requests every five hours - roughly one curious
# visitor. A live demo that dies while someone is judging it is worse than one
# that never claimed to be live.
#
# And it costs nothing to leave out. `PARCHI_DEMO_PROVIDER=heuristic` runs the
# offline lexical matcher in place of the model call, all sixteen scenarios
# return their correct verdicts including the prompt injection, and it is the
# same reproducible no-key path the README publishes as 280/280. The page says
# on itself that the Parchi row came from the stand-in rather than a model,
# which is exactly what it should say when that is true.
#
# To run it against a real model, set PARCHI_OPENAI_API_KEY in the host's
# environment and drop PARCHI_DEMO_PROVIDER. Do that on a private deploy.

services:
  - type: web
    name: parchi-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn demo.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # PARCHI_DEMO_PROVIDER is deliberately NOT set here.
      #
      # Unset, the demo uses a live model when PARCHI_OPENAI_API_KEY is present
      # in the host's environment, and asks for human confirmation when it is
      # not. Set it to `heuristic` to force the offline matcher instead, which
      # is the right choice for a public deploy with no key: every scenario
      # returns its correct verdict and there is nothing to run up a bill.
      #
      # Read this before adding a key to a PUBLIC deploy. The intent check
      # degrades rather than failing, so when a rate-limited key runs out of
      # quota every model-bound scenario silently returns STEP_UP instead of
      # its real verdict - the page keeps working and stops being right.
      # FAILURES.md entry 24 is that exact failure, found the hard way. The
      # console's defence lamp reports it, but nobody is watching a public
      # demo's console. A dev key rated at 100 requests per five hours is
      # roughly one curious visitor.
      #
      # - key: PARCHI_DEMO_PROVIDER
      #   value: heuristic
      # The console is OFF unless an operator is configured, which is what
      # should happen on a public host: it is a fraud console, and the page
      # a public deploy must not hand anybody is the one showing which
      # attempts were noticed.
      #
      # To turn it on for a demo, set these three in the host's environment -
      # in the dashboard, never here, because this file is public and two of
      # them are credentials:
      #
      #   PARCHI_CONSOLE_EMAIL          the operator's address
      #   PARCHI_CONSOLE_PASSWORD_HASH  from `python -m parchi.console_setup`
      #   PARCHI_HUMAN_APPROVAL_SECRET  the code that approves a step-up
      #
      # The hash is scrypt, so the environment never holds the password. The
      # step-up secret is not a hash and is compared with compare_digest, so
      # it is a shared code rather than a password: treat it as one.
      #
      # `GET /api/health` answers `console` and `human_approval`, which is how
      # to tell a host that is refusing on purpose from one that lost its
      # environment. Both look identical from the sign-in page.
